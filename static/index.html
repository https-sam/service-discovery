<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>service catalog</title>
<style>
  :root {
    --bg: #FAF7F0;
    --ink: #1A1A1A;
    --muted: #8C8478;
    --rule: #DDD7C7;
    --accent: #B85C38;
    --soft: #F0EBE0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding: 6rem 2rem 8rem;
    min-height: 100vh;
  }

  main {
    max-width: 680px;
    margin: 0 auto;
  }

  .mono {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
  }

  .header {
    margin-bottom: 4rem;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-size: 2rem;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  form {
    margin-bottom: 2.5rem;
  }

  .input-row {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 0.5rem;
  }

  .input-prefix {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.85rem;
    color: var(--accent);
  }

  input[type="text"] {
    flex: 1;
    border: none;
    background: transparent;
    font: inherit;
    font-size: 1.1rem;
    color: var(--ink);
    padding: 0.4rem 0;
  }

  input[type="text"]:focus { outline: none; }
  input[type="text"]::placeholder { color: var(--muted); font-style: italic; }

  .submit-hint {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* Pipeline steps */
  .steps {
    margin-bottom: 3rem;
  }

  .step {
    border-top: 1px solid var(--rule);
    padding: 1rem 0;
    cursor: pointer;
    transition: opacity 200ms ease;
  }

  .step:last-child { border-bottom: 1px solid var(--rule); }
  .step.pending { opacity: 0.4; cursor: default; }
  .step.pending:hover { opacity: 0.4; }
  .step:hover { opacity: 0.85; }

  .step-row {
    display: grid;
    grid-template-columns: 2.5rem 1fr auto auto;
    gap: 1rem;
    align-items: center;
  }

  .step-num {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .step-title {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.92rem;
    color: var(--ink);
    letter-spacing: 0.01em;
  }

  .step-status {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .step.in-progress .step-status { color: var(--accent); }
  .step.done .step-status { color: var(--muted); }

  .step-chevron {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.85rem;
    color: var(--muted);
    width: 1rem;
    text-align: center;
    transition: transform 200ms ease;
  }

  .step.expanded .step-chevron { transform: rotate(90deg); }

  .step-detail {
    max-height: 0;
    overflow: hidden;
    transition: max-height 300ms ease;
  }

  .step.expanded .step-detail {
    max-height: 2000px;
    padding-top: 1rem;
  }

  .detail-inner {
    margin-left: 3.5rem;
    padding-left: 1rem;
    border-left: 1px solid var(--rule);
  }

  .detail-row {
    display: grid;
    grid-template-columns: 6rem 1fr;
    gap: 1rem;
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    color: var(--ink);
  }

  .detail-row + .detail-row { margin-top: 0.25rem; }

  .detail-label {
    color: var(--muted);
    text-align: right;
  }

  .detail-value-soft { color: var(--muted); }

  /* Answer */
  .answer {
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 2px solid var(--ink);
  }

  .answer.hidden { display: none; }

  .answer-label {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.25rem;
  }

  .answer-body {
    font-size: 1.1rem;
    line-height: 1.75;
    color: var(--ink);
  }

  .answer-body code {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.9em;
    background: var(--soft);
    padding: 0.05em 0.3em;
    border-radius: 2px;
  }

  .cite {
    display: inline-block;
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.7em;
    font-weight: 500;
    color: var(--accent);
    vertical-align: super;
    line-height: 1;
    margin-left: 0.1em;
    cursor: pointer;
    transition: background 120ms ease;
    border-radius: 2px;
    padding: 0 0.15em;
  }

  .cite:hover,
  .cite.active {
    background: var(--accent);
    color: var(--bg);
  }

  .cite-popover {
    position: absolute;
    z-index: 10;
    max-width: 440px;
    background: var(--bg);
    border: 1px solid var(--ink);
    padding: 1rem 1.25rem 1.1rem;
    font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, serif;
    font-size: 0.92rem;
    line-height: 1.6;
    box-shadow: 0 6px 24px rgba(26, 26, 26, 0.08);
  }

  .cite-popover-meta {
    font-family: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.6rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--rule);
  }

  .cite-popover-meta .num {
    color: var(--accent);
    margin-right: 0.5em;
  }

  .cite-popover-text {
    color: var(--ink);
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .cursor {
    display: inline-block;
    width: 0.5em;
    height: 1em;
    vertical-align: text-bottom;
    background: var(--ink);
    margin-left: 1px;
    animation: blink 1.1s steps(2) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
<main>
  <div class="header">
    <div class="eyebrow">service catalog</div>
    <h1>ask anything about the <em>microservices</em>.</h1>
  </div>

  <form id="query-form">
    <div class="input-row">
      <span class="input-prefix">&gt;</span>
      <input
        id="query"
        type="text"
        autocomplete="off"
        autofocus
        placeholder="what does cartservice do, and what does it depend on?"
      />
      <span class="submit-hint">⏎</span>
    </div>
  </form>

  <div class="steps" id="steps"></div>

  <div class="answer hidden" id="answer">
    <div class="answer-label">answer</div>
    <div class="answer-body" id="answer-body"></div>
  </div>
</main>

<script>
  const form = document.getElementById('query-form');
  const queryInput = document.getElementById('query');
  const stepsEl = document.getElementById('steps');
  const answerEl = document.getElementById('answer');
  const answerBody = document.getElementById('answer-body');

  let answerBuffer = '';
  let currentSource = null;
  let currentHits = [];
  let stepCount = 0;
  let activePopover = null;
  let popoverDismiss = null;
  let activeCite = null;

  function reset() {
    if (currentSource) currentSource.close();
    closePopover();
    answerBuffer = '';
    answerBody.innerHTML = '';
    answerEl.classList.add('hidden');
    stepsEl.innerHTML = '';
    currentHits = [];
    stepCount = 0;
  }

  // Create a step row when the server starts that step. Steps appear in the
  // order the server emits them, so the UI adapts to whichever route runs.
  function appendStep(stepId, label) {
    stepCount += 1;
    const div = document.createElement('div');
    div.className = 'step in-progress';
    div.dataset.step = stepId;
    div.innerHTML = `
      <div class="step-row">
        <div class="step-num">${String(stepCount).padStart(2, '0')}</div>
        <div class="step-title">${escapeHtml(label || stepId)}</div>
        <div class="step-status">running</div>
        <div class="step-chevron">›</div>
      </div>
      <div class="step-detail"><div class="detail-inner"></div></div>
    `;
    div.addEventListener('click', () => {
      if (!div.classList.contains('pending')) {
        div.classList.toggle('expanded');
      }
    });
    stepsEl.appendChild(div);
    return div;
  }

  function markStepDone(stepId) {
    const el = stepsEl.querySelector(`[data-step="${stepId}"]`);
    if (!el) return;
    el.classList.remove('pending', 'in-progress');
    el.classList.add('done');
    el.querySelector('.step-status').textContent = 'done';
  }

  function setStepDetail(stepId, html) {
    const el = stepsEl.querySelector(`[data-step="${stepId}"]`);
    if (!el) return;
    el.querySelector('.detail-inner').innerHTML = html;
  }

  function row(label, value, soft) {
    const cls = soft ? 'detail-value-soft' : '';
    return `<div class="detail-row"><div class="detail-label">${label}</div><div class="${cls}">${value}</div></div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[c]);
  }

  function renderStepDetail(stepId, data) {
    if (stepId === 'classify') {
      const out = [row('strategy', `<strong>${escapeHtml(data.strategy)}</strong>`)];
      const f = data.filter || {};
      if (Object.keys(f).length === 0) {
        out.push(row('filter', '<span class="detail-value-soft">(none)</span>'));
      } else {
        for (const [k, v] of Object.entries(f)) {
          out.push(row(escapeHtml(k), escapeHtml(v)));
        }
      }
      return out.join('');
    }
    if (stepId === 'filter') {
      const out = [];
      const f = data.filter || {};
      for (const [k, v] of Object.entries(f)) {
        out.push(row(escapeHtml(k), escapeHtml(v)));
      }
      if (typeof data.matched_chunks === 'number') {
        out.push(row('matched', `${data.matched_chunks} chunks`));
      }
      if (Array.isArray(data.hits)) {
        out.push(row('matched', `${data.hits.length} chunks`));
      }
      return out.join('');
    }
    if (stepId === 'expand') {
      return data.queries.map((q, i) =>
        row(i === 0 ? 'original' : String(i), escapeHtml(q))
      ).join('');
    }
    if (stepId === 'embed') {
      return row('embedded', `${data.count} ${data.count === 1 ? 'query' : 'queries'} · 768-d`);
    }
    if (stepId === 'retrieve') {
      if (data.rankings) {
        return data.rankings.map((ranking, i) => {
          const top = ranking.slice(0, 5)
            .map(r => `${r.service}<span class="detail-value-soft">/${r.section}</span>`)
            .join(', ');
          return row(i === 0 ? 'q0 (orig)' : `q${i}`, top);
        }).join('');
      }
      if (data.hits) {
        return data.hits.map(h =>
          row(`[${h.rank}]`,
              `${escapeHtml(h.service_name)} <span class="detail-value-soft">· ${escapeHtml(h.section)}${
                h.rrf_score !== null && h.rrf_score !== undefined
                  ? ' · score=' + h.rrf_score.toFixed(4) : ''}</span>`)
        ).join('');
      }
    }
    if (stepId === 'fuse') {
      return data.hits.map(h =>
        row(`[${h.rank}]`,
            `${escapeHtml(h.service_name)} <span class="detail-value-soft">· ${escapeHtml(h.section)} · rrf=${h.rrf_score.toFixed(4)}</span>`)
      ).join('');
    }
    return '';
  }

  function renderAnswer(text) {
    const escaped = escapeHtml(text);
    return escaped
      .replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/^/, '<p>')
      .replace(/$/, '</p>');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = queryInput.value.trim();
    if (!q) return;
    reset();

    const es = new EventSource(`/query?q=${encodeURIComponent(q)}`);
    currentSource = es;

    es.addEventListener('step_started', (e) => {
      const { id, label } = JSON.parse(e.data);
      appendStep(id, label);
    });

    es.addEventListener('step_done', (e) => {
      const { id, data } = JSON.parse(e.data);
      markStepDone(id);
      if (data) {
        const el = stepsEl.querySelector(`[data-step="${id}"]`);
        if (el) el.querySelector('.detail-inner').innerHTML = renderStepDetail(id, data);
      }
      // Capture hits from whichever retrieval step produced them.
      // Open route emits hits in 'fuse'; scoped emits in 'retrieve'; aggregate in 'filter'.
      if (data && Array.isArray(data.hits)) currentHits = data.hits;
    });

    es.addEventListener('answer_token', (e) => {
      const { text } = JSON.parse(e.data);
      if (answerEl.classList.contains('hidden')) {
        answerEl.classList.remove('hidden');
      }
      answerBuffer += text;
      answerBody.innerHTML = renderAnswer(answerBuffer) +
        '<span class="cursor"></span>';
    });

    es.addEventListener('complete', () => {
      answerBody.innerHTML = renderAnswer(answerBuffer);
      es.close();
      currentSource = null;
    });

    es.addEventListener('error', () => {
      es.close();
      currentSource = null;
    });
  });

  // Citation popovers - click a [N] to inspect the underlying chunk.
  // Event delegation so it survives the answerBody.innerHTML rewrites
  // that happen on every streamed token.
  answerBody.addEventListener('click', (ev) => {
    const cite = ev.target.closest('.cite');
    if (!cite) return;
    ev.stopPropagation();
    const match = cite.textContent.match(/\d+/);
    if (!match) return;
    const n = parseInt(match[0], 10);
    if (activeCite === cite) {
      closePopover();
      return;
    }
    showCitePopover(cite, n);
  });

  function showCitePopover(anchor, n) {
    closePopover();
    const hit = currentHits[n - 1];
    if (!hit) return;

    const pop = document.createElement('div');
    pop.className = 'cite-popover';
    pop.innerHTML = `
      <div class="cite-popover-meta">
        <span class="num">[${n}]</span>${escapeHtml(hit.service_name)} · ${escapeHtml(hit.section)}
      </div>
      <div class="cite-popover-text">${escapeHtml(hit.text)}</div>
    `;
    document.body.appendChild(pop);

    // Position below the anchor, clamped to the viewport.
    const rect = anchor.getBoundingClientRect();
    const popRect = pop.getBoundingClientRect();
    const margin = 12;
    let top = window.scrollY + rect.bottom + 8;
    let left = window.scrollX + rect.left - 24;
    const maxLeft = window.scrollX + document.documentElement.clientWidth - popRect.width - margin;
    if (left > maxLeft) left = maxLeft;
    if (left < window.scrollX + margin) left = window.scrollX + margin;
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';

    activePopover = pop;
    activeCite = anchor;
    anchor.classList.add('active');

    popoverDismiss = (e) => {
      if (e.target.closest('.cite-popover') || e.target.closest('.cite')) return;
      closePopover();
    };
    setTimeout(() => document.addEventListener('click', popoverDismiss), 0);
  }

  function closePopover() {
    if (activePopover) {
      activePopover.remove();
      activePopover = null;
    }
    if (activeCite) {
      activeCite.classList.remove('active');
      activeCite = null;
    }
    if (popoverDismiss) {
      document.removeEventListener('click', popoverDismiss);
      popoverDismiss = null;
    }
  }

  window.addEventListener('resize', closePopover);
</script>
</body>
</html>
