requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "ragas>=0.2",
    "langchain-google-vertexai>=2.0",
    "langchain-google-genai>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
]

[tool.uv]
package = false
